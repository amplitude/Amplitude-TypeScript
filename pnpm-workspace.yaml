packages:
  - packages/*
  - apps/*
  - examples/react-native/app
  - examples/unified/react-native-app

overrides:
  typescript: ^4.9.4
  # Newer nwsapi regresses escaped numeric-leading ID selectors in jsdom tests.
  nwsapi: 2.2.22
  js-cookie: ^3.0.7
  # Keep scanner-reported transitive packages on patched releases in their existing majors.
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  '@babel/plugin-transform-modules-systemjs@7': ^7.29.8
  node-forge@1: ^1.4.2
  follow-redirects@1: ^1.16.2
  'lerna>nx': ^22.7.10
  'lerna>@nx/devkit': ^22.7.10
  fast-xml-parser@4: ^4.5.5
  fast-xml-parser@5: ^5.7.0

blockExoticSubdeps: true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@amplitude/*'

# These are dependencies that run the postinstall script
# Only add dependencies to this if they have been vetted for security
allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  nx: true
  unrs-resolver: true

publicHoistPattern:
  - '*react-native*'
  - '@babel/*'
  - '@react-native/*'
  - '@react-native-community/*'
  - metro
  - 'metro-*'

trustPolicy: no-downgrade
# These exact versions are already locked and predate the current publisher
# trust level. Keep the exception scoped to the existing versions.
trustPolicyExclude:
  - '@octokit/endpoint@9.0.6'
  - 'eslint-config-prettier@8.10.2'
  - 'eslint-plugin-prettier@4.2.5'
  - 'rollup@2.80.0'
  - 'semver@5.7.2'
  - 'semver@6.3.1'
