<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR Page Load Perf</title>
    <script>
      // Register the perf observers before anything else runs so `buffered: true` sees
      // every long task / LCP candidate from navigation start onward.
      window.__perf = { longTasks: [], lcp: 0, loadAt: 0, domBuiltAt: 0, domBuildMs: 0 };
      try {
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            window.__perf.longTasks.push({ start: entry.startTime, duration: entry.duration });
          }
        }).observe({ type: 'longtask', buffered: true });
      } catch (e) {
        window.__perf.longTaskObserverError = String(e);
      }
      try {
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            window.__perf.lcp = entry.startTime;
          }
        }).observe({ type: 'largest-contentful-paint', buffered: true });
      } catch (e) {
        window.__perf.lcpObserverError = String(e);
      }
      window.addEventListener('load', () => {
        window.__perf.loadAt = performance.now();
      });
    </script>
    <style>
      .row {
        display: flex;
        gap: 8px;
        padding: 2px 4px;
        border-bottom: 1px solid #eee;
        font: 12px/1.4 sans-serif;
      }
      .row-0 { background: #fafafa; }
      .row-3 { color: #336; }
      .row-5 { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1 id="hero">Session Replay page-load perf harness</h1>
    <div id="status">loading</div>
    <div id="app"></div>
    <script>
      // Build a large DOM synchronously, before the SDK loads, so the initial rrweb full snapshot
      // has realistic cost. `nodes` is the row count; each row contributes 5 DOM nodes.
      (function buildDom() {
        const params = new URLSearchParams(location.search);
        const rows = params.has('nodes') ? Number(params.get('nodes')) : 0;
        const buildStart = performance.now();
        const app = document.getElementById('app');
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < rows; i++) {
          const row = document.createElement('div');
          row.className = 'row row-' + (i % 7);
          row.setAttribute('data-index', String(i));
          const label = document.createElement('span');
          label.textContent = 'Item ' + i + ' — lorem ipsum dolor sit amet';
          const input = document.createElement('input');
          input.type = 'text';
          input.value = 'value ' + i;
          const link = document.createElement('a');
          link.href = '/item/' + i;
          link.textContent = 'open';
          row.appendChild(label);
          row.appendChild(input);
          row.appendChild(link);
          fragment.appendChild(row);
        }
        app.appendChild(fragment);
        window.__perf.domBuiltAt = performance.now();
        window.__perf.domBuildMs = window.__perf.domBuiltAt - buildStart;

        // Hold the window `load` event open with a slow subresource so tests can tell
        // "before load" from "after load". The test intercepts and delays this URL.
        const slowResource = params.get('slowResource');
        if (slowResource) {
          const img = new Image();
          img.src = slowResource;
          img.alt = '';
          img.width = 1;
          img.height = 1;
          document.body.appendChild(img);
        }
      })();
    </script>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const parseBool = (raw) => (raw === null ? undefined : raw === 'true');
      const parseNumber = (raw) => {
        if (raw === null) return undefined;
        const n = Number(raw);
        return Number.isNaN(n) ? undefined : n;
      };

      const markReady = (statusText) => {
        window.srReady = true;
        document.getElementById('status').textContent = statusText;
      };

      // `skipSdk=true` is the no-SDK control: the page's own load cost, with the SDK never
      // imported. The perf suite subtracts it to isolate SDK-attributable blocking.
      if (params.get('skipSdk') === 'true') {
        window.__perf.initStartedAt = performance.now();
        window.__perf.initResolvedAt = performance.now();
        markReady('ready (no sdk)');
      } else {
        const sessionReplay = await import('@amplitude/session-replay-browser');
        window.sessionReplay = sessionReplay;

        const sessionId = params.has('sessionId') ? Number(params.get('sessionId')) : Date.now();
        const deviceId = params.get('deviceId') ?? 'test-device-id';
        const logLevel = params.has('logLevel') ? Number(params.get('logLevel')) : 0;
        const useWebWorker = params.get('useWebWorker') === 'true';

        // deferFullSnapshot is only passed to init() when `deferFullSnapshot` is present in the
        // URL, so omitting it preserves the SDK default (no deferral).
        const deferEnabled = parseBool(params.get('deferFullSnapshot'));
        const deferUntil = params.get('deferUntil') ?? undefined;
        const deferDelayMs = parseNumber(params.get('deferDelayMs'));
        const deferMaxWaitMs = parseNumber(params.get('deferMaxWaitMs'));
        const deferFullSnapshot =
          deferEnabled !== undefined
            ? {
                enabled: deferEnabled,
                ...(deferUntil !== undefined ? { until: deferUntil } : {}),
                ...(deferDelayMs !== undefined ? { delayMs: deferDelayMs } : {}),
                ...(deferMaxWaitMs !== undefined ? { maxWaitMs: deferMaxWaitMs } : {}),
              }
            : undefined;
        const eagerFullSnapshotSend = parseBool(params.get('eagerFullSnapshotSend'));

        window.__perf.initStartedAt = performance.now();
        try {
          await sessionReplay.init('d90c5cf09ca2546a1626272906b99a76', {
            deviceId,
            sessionId,
            sampleRate: 1.0,
            logLevel,
            useWebWorker,
            performanceConfig: { enabled: true },
            ...(deferFullSnapshot ? { deferFullSnapshot } : {}),
            ...(eagerFullSnapshotSend !== undefined ? { eagerFullSnapshotSend } : {}),
          }).promise;
        } catch (err) {
          document.getElementById('status').textContent = 'error: ' + err.message;
          window.srError = err.message;
        }
        window.__perf.initResolvedAt = performance.now();
        markReady('ready');
      }
    </script>
    <script>
      /**
       * Snapshot of the page-load metrics the e2e suite compares between configs. Long tasks
       * are attributed to the SDK only when they start after the synthetic DOM build finished
       * (the build itself is a constant-cost long task present in every config).
       */
      window.getPerfMetrics = function getPerfMetrics() {
        const nav = performance.getEntriesByType('navigation')[0];
        const perf = window.__perf;
        const loadEventStart = nav ? nav.loadEventStart : perf.loadAt;
        const sdkTasks = perf.longTasks.filter((task) => task.start >= perf.domBuiltAt);
        const beforeLoad = sdkTasks.filter((task) => task.start < loadEventStart);
        const blocking = (tasks) => tasks.reduce((sum, task) => sum + Math.max(0, task.duration - 50), 0);
        return {
          timeOrigin: performance.timeOrigin,
          loadEventStart,
          loadEventEnd: nav ? nav.loadEventEnd : perf.loadAt,
          domContentLoaded: nav ? nav.domContentLoadedEventEnd : 0,
          lcp: perf.lcp,
          domBuildMs: perf.domBuildMs,
          initStartedAt: perf.initStartedAt ?? 0,
          initResolvedAt: perf.initResolvedAt ?? 0,
          longTasksBeforeLoad: beforeLoad.length,
          blockingBeforeLoadMs: blocking(beforeLoad),
          longestTaskBeforeLoadMs: beforeLoad.reduce((max, task) => Math.max(max, task.duration), 0),
          longTasksTotal: sdkTasks.length,
          blockingTotalMs: blocking(sdkTasks),
          longTaskObserverError: perf.longTaskObserverError,
        };
      };
    </script>
  </body>
</html>
