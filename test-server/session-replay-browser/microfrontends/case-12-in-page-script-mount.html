<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Case 12 — In-page script mount MFE</title>
    <link rel="stylesheet" href="./mfe-parent-styles.css" />
    <style>
      #mfe-root {
        background: linear-gradient(90deg, #059669, #34d399);
        color: #022c22;
        padding: 20px;
        border-radius: 8px;
        min-height: 160px;
      }
    </style>
  </head>
  <body>
    <header class="shell-header">
      <span class="tag">Case 12</span>
      <h1>Microfrontend mounted into a div (no iframe)</h1>
    </header>
    <main class="shell-main">
      <div class="parent-panel">
        <button type="button" id="load-mfe">Load / remount MFE bundle</button>
      </div>
      <div class="mfe-slot">
        <div id="mfe-root" data-mfe-container>Container empty — click load.</div>
      </div>
      <div id="status">loading</div>
    </main>
    <script type="module">
      import * as sessionReplay from '@amplitude/session-replay-browser';

      const params = new URLSearchParams(location.search);
      const sessionId = params.has('sessionId') ? Number(params.get('sessionId')) : Date.now();
      const deviceId = params.get('deviceId') ?? 'mfe-parent-device';
      const apiKey =
        params.get('apiKey') || import.meta.env.VITE_AMPLITUDE_API_KEY || 'd90c5cf09ca2546a1626272906b99a76';

      let mountCount = 0;
      function mountInPageMfe() {
        mountCount += 1;
        const root = document.getElementById('mfe-root');
        root.innerHTML =
          '<h2 id="inpage-mfe-title">In-page MFE v' +
          mountCount +
          '</h2>' +
          '<button type="button" id="inpage-mfe-btn">In-page action</button>' +
          '<input id="inpage-mfe-input" placeholder="Type in mounted MFE" />';
        root.querySelector('#inpage-mfe-btn').addEventListener('click', () => {
          document.getElementById('inpage-mfe-title').textContent = 'In-page MFE clicked ' + Date.now();
        });
      }

      document.getElementById('load-mfe').addEventListener('click', mountInPageMfe);

      void (async () => {
        const statusEl = document.getElementById('status');
        try {
          await sessionReplay.init(apiKey, { deviceId, sessionId, sampleRate: 1 }).promise;
        } catch (err) {
          statusEl.textContent = 'error: ' + err.message;
          return;
        }
        mountInPageMfe();
        window.srReady = true;
        statusEl.textContent = 'ready — single-document MFE mount';
      })();
    </script>
  </body>
</html>
