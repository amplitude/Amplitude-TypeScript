<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MFE middle layer</title>
    <style>
      body {
        margin: 0;
        background: #0f766e;
        color: #ecfdf5;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      iframe {
        width: 100%;
        height: 220px;
        border: 2px solid #99f6e4;
        border-radius: 6px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <strong id="middle-label">MIDDLE MFE LAYER</strong>
    <p>Hosts a third-level widget iframe.</p>
    <div id="inner-slot"></div>
    <div id="status">loading</div>
    <script>
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'amplitude-sr-iframe') {
          if (event.data.action === 'start') window.receivedStartSignal = true;
        }
      });
    </script>
    <script type="module">
      import * as sessionReplay from '@amplitude/session-replay-browser';

      const params = new URLSearchParams(location.search);
      const sessionId = params.has('sessionId') ? Number(params.get('sessionId')) : Date.now();
      const deviceId = params.get('deviceId') ?? 'mfe-middle-device';
      const apiKey =
        params.get('apiKey') || import.meta.env.VITE_AMPLITUDE_API_KEY || 'd90c5cf09ca2546a1626272906b99a76';
      const leafSrc =
        params.get('leafSrc') ?? '/session-replay-browser/microfrontends/mfe-child-app.html';

      void (async () => {
        const statusEl = document.getElementById('status');
        try {
          await sessionReplay.init(apiKey, {
            deviceId,
            sessionId,
            sampleRate: 1,
            crossOriginIframes: { enabled: true },
          }).promise;
        } catch (err) {
          statusEl.textContent = 'error: ' + err.message;
          return;
        }

        const iframe = document.createElement('iframe');
        iframe.id = 'leaf-mfe-frame';
        iframe.src =
          leafSrc +
          '?withSdk=true&crossOrigin=true&label=' +
          encodeURIComponent('Leaf widget') +
          '&sessionId=' +
          sessionId +
          '&deviceId=leaf-' +
          encodeURIComponent(deviceId);
        document.getElementById('inner-slot').appendChild(iframe);
        window.srReady = true;
        statusEl.textContent = 'middle ready';
      })();
    </script>
  </body>
</html>
