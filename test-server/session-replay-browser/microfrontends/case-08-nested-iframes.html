<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Case 08 — Nested iframes</title>
    <link rel="stylesheet" href="./mfe-parent-styles.css" />
  </head>
  <body>
    <header class="shell-header">
      <span class="tag">Case 08</span>
      <h1>Shell → middle MFE → leaf widget (three iframes)</h1>
    </header>
    <main class="shell-main">
      <div class="parent-panel">Top shell with cross-origin coordination enabled.</div>
      <div class="mfe-slot" id="mfe-slot"></div>
      <div id="status">loading</div>
    </main>
    <script type="module">
      import * as sessionReplay from '@amplitude/session-replay-browser';

      const params = new URLSearchParams(location.search);
      const sessionId = params.has('sessionId') ? Number(params.get('sessionId')) : Date.now();
      const deviceId = params.get('deviceId') ?? 'mfe-parent-device';
      const apiKey =
        params.get('apiKey') || import.meta.env.VITE_AMPLITUDE_API_KEY || 'd90c5cf09ca2546a1626272906b99a76';
      const middleSrc =
        params.get('middleSrc') ?? '/session-replay-browser/microfrontends/mfe-nested-middle.html';

      void (async () => {
        const statusEl = document.getElementById('status');
        try {
          await sessionReplay.init(apiKey, {
            deviceId,
            sessionId,
            sampleRate: 1,
            crossOriginIframes: { enabled: true },
          }).promise;
        } catch (err) {
          statusEl.textContent = 'error: ' + err.message;
          return;
        }

        const iframe = document.createElement('iframe');
        iframe.id = 'middle-mfe-frame';
        iframe.src =
          middleSrc +
          '?sessionId=' +
          sessionId +
          '&deviceId=' +
          encodeURIComponent(deviceId) +
          '&apiKey=' +
          encodeURIComponent(apiKey);
        document.getElementById('mfe-slot').appendChild(iframe);
        window.srReady = true;
        statusEl.textContent = 'ready — 3-level iframe tree';
      })();
    </script>
  </body>
</html>
