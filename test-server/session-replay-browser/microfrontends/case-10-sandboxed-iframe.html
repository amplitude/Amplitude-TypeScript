<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Case 10 — Sandboxed iframe MFE</title>
    <link rel="stylesheet" href="./mfe-parent-styles.css" />
  </head>
  <body>
    <header class="shell-header">
      <span class="tag">Case 10</span>
      <h1>Sandboxed microfrontend iframe (no allow-same-origin)</h1>
    </header>
    <main class="shell-main">
      <div class="parent-panel">
        Toggle sandbox mode:
        <button type="button" id="mode-strict">Strict sandbox (no same-origin)</button>
        <button type="button" id="mode-relaxed">Relaxed sandbox (allow-same-origin)</button>
      </div>
      <div class="mfe-slot" id="mfe-slot"></div>
      <div id="status">loading</div>
      <details class="scenario-notes" open>
        <summary>Expected behaviour</summary>
        <p>
          Without <code>allow-same-origin</code>, the iframe is opaque to the parent document — nested UI often
          appears blank in parent-only replay unless cross-origin child SDK coordination is used.
        </p>
      </details>
    </main>
    <script type="module">
      import * as sessionReplay from '@amplitude/session-replay-browser';

      const params = new URLSearchParams(location.search);
      const sessionId = params.has('sessionId') ? Number(params.get('sessionId')) : Date.now();
      const deviceId = params.get('deviceId') ?? 'mfe-parent-device';
      const apiKey =
        params.get('apiKey') || import.meta.env.VITE_AMPLITUDE_API_KEY || 'd90c5cf09ca2546a1626272906b99a76';
      const childSrc = params.get('childSrc') ?? '/session-replay-browser/microfrontends/mfe-child-app.html';

      function mountIframe(sandboxTokens) {
        document.getElementById('mfe-slot').innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.id = 'mfe-child-frame';
        if (sandboxTokens) {
          iframe.setAttribute('sandbox', sandboxTokens);
        }
        iframe.src = childSrc + '?withSdk=false&label=' + encodeURIComponent('Sandboxed MFE') + '&sessionId=' + sessionId;
        document.getElementById('mfe-slot').appendChild(iframe);
        window.currentSandbox = sandboxTokens;
      }

      document.getElementById('mode-strict').addEventListener('click', () =>
        mountIframe('allow-scripts allow-forms allow-popups')
      );
      document.getElementById('mode-relaxed').addEventListener('click', () =>
        mountIframe('allow-scripts allow-forms allow-same-origin allow-popups')
      );

      void (async () => {
        const statusEl = document.getElementById('status');
        try {
          await sessionReplay.init(apiKey, {
            deviceId,
            sessionId,
            sampleRate: 1,
            crossOriginIframes: { enabled: true },
          }).promise;
        } catch (err) {
          statusEl.textContent = 'error: ' + err.message;
          return;
        }
        mountIframe('allow-scripts allow-forms allow-popups');
        window.srReady = true;
        statusEl.textContent = 'ready — default strict sandbox; switch modes above';
      })();
    </script>
  </body>
</html>
