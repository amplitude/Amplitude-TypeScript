<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Case 06 — Analytics plugin + iframe MFE</title>
    <link rel="stylesheet" href="./mfe-parent-styles.css" />
  </head>
  <body>
    <header class="shell-header">
      <span class="tag">Case 06</span>
      <h1>Browser SDK + session replay plugin on shell only</h1>
    </header>
    <main class="shell-main">
      <div class="parent-panel">
        <button type="button" id="track-btn">Track shell event</button>
        <button type="button" id="mount-mfe">Mount MFE iframe</button>
      </div>
      <div class="mfe-slot" id="mfe-slot"></div>
      <div id="status">loading</div>
    </main>
    <script type="module">
      import * as amplitude from '@amplitude/analytics-browser';
      import { sessionReplayPlugin } from '@amplitude/plugin-session-replay-browser';

      const params = new URLSearchParams(location.search);
      const apiKey =
        params.get('apiKey') || import.meta.env.VITE_AMPLITUDE_API_KEY || 'd90c5cf09ca2546a1626272906b99a76';
      const childSrc = params.get('childSrc') ?? '/session-replay-browser/microfrontends/mfe-child-app.html';
      const crossOrigin = params.get('crossOrigin') === 'true';

      const statusEl = document.getElementById('status');

      try {
        const pluginOptions = { sampleRate: 1.0, logLevel: 'debug' };
        if (crossOrigin) {
          pluginOptions.crossOriginIframes = { enabled: true };
        }
        amplitude.add(sessionReplayPlugin(pluginOptions));
        amplitude.init(apiKey, 'mfe-shell-user@test.local', {
          logLevel: amplitude.Types.LogLevel.Debug,
        });
        window.amplitude = amplitude;
        window.srReady = true;
        statusEl.textContent = crossOrigin
          ? 'ready — plugin on parent, crossOrigin via ?crossOrigin=true'
          : 'ready — plugin on parent, default options';
      } catch (err) {
        statusEl.textContent = 'error: ' + err.message;
      }

      document.getElementById('track-btn').addEventListener('click', () => {
        amplitude.track('mfe_shell_interaction', { case: '06' });
      });

      document.getElementById('mount-mfe').addEventListener('click', () => {
        if (document.getElementById('mfe-child-frame')) return;
        const sessionId = amplitude.getSessionId();
        const iframe = document.createElement('iframe');
        iframe.id = 'mfe-child-frame';
        iframe.src =
          childSrc +
          '?withSdk=false&label=' +
          encodeURIComponent('Plugin case — child w/o SDK') +
          '&sessionId=' +
          sessionId;
        document.getElementById('mfe-slot').appendChild(iframe);
        window.iframeAdded = true;
      });
    </script>
  </body>
</html>
