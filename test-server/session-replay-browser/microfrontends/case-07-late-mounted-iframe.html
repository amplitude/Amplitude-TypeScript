<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Case 07 — Late-mounted MFE iframe</title>
    <link rel="stylesheet" href="./mfe-parent-styles.css" />
  </head>
  <body>
    <header class="shell-header">
      <span class="tag">Case 07</span>
      <h1>Microfrontend iframe added after session replay starts</h1>
    </header>
    <main class="shell-main">
      <div class="parent-panel">
        <p>Child loads automatically after <span id="delay-label">3</span>s, or click mount now.</p>
        <button type="button" id="mount-now">Mount MFE now</button>
      </div>
      <div class="mfe-slot" id="mfe-slot"><p style="padding: 12px">Waiting for MFE…</p></div>
      <div id="status">loading</div>
    </main>
    <script type="module">
      import * as sessionReplay from '@amplitude/session-replay-browser';

      const params = new URLSearchParams(location.search);
      const sessionId = params.has('sessionId') ? Number(params.get('sessionId')) : Date.now();
      const deviceId = params.get('deviceId') ?? 'mfe-parent-device';
      const apiKey =
        params.get('apiKey') || import.meta.env.VITE_AMPLITUDE_API_KEY || 'd90c5cf09ca2546a1626272906b99a76';
      const childSrc = params.get('childSrc') ?? '/session-replay-browser/microfrontends/mfe-child-app.html';
      const delayMs = params.has('delayMs') ? Number(params.get('delayMs')) : 3000;
      const useCrossOrigin = params.get('crossOrigin') !== 'false';

      document.getElementById('delay-label').textContent = String(delayMs / 1000);

      function mountChild() {
        if (document.getElementById('mfe-child-frame')) return;
        document.getElementById('mfe-slot').innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.id = 'mfe-child-frame';
        iframe.src =
          childSrc +
          '?withSdk=' +
          (useCrossOrigin ? 'true' : 'false') +
          '&crossOrigin=' +
          (useCrossOrigin ? 'true' : 'false') +
          '&label=' +
          encodeURIComponent('Late-mounted MFE') +
          '&sessionId=' +
          sessionId +
          '&deviceId=' +
          encodeURIComponent(deviceId);
        document.getElementById('mfe-slot').appendChild(iframe);
        window.iframeAdded = true;
        window.lateMountAt = Date.now();
      }

      document.getElementById('mount-now').addEventListener('click', mountChild);

      void (async () => {
        const statusEl = document.getElementById('status');
        const initOptions = { deviceId, sessionId, sampleRate: 1 };
        if (useCrossOrigin) {
          initOptions.crossOriginIframes = { enabled: true };
        }
        try {
          await sessionReplay.init(apiKey, initOptions).promise;
        } catch (err) {
          statusEl.textContent = 'error: ' + err.message;
          return;
        }
        window.srReady = true;
        statusEl.textContent = 'recording — MFE mounts in ' + delayMs + 'ms';
        setTimeout(mountChild, delayMs);
      })();
    </script>
  </body>
</html>
