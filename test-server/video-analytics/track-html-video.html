<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Track HTML Video Test</title>
  </head>
  <body>
    <video id="video" controls width="640" preload="metadata" metadata-video-title="My Video" metadata-video-id="video-123">
      Your browser does not support the video tag.
    </video>
    <button id="prev-video">Prev video</button>
    <button id="next-video">Next video</button>
    <button id="stop-video">Stop Capturing</button>
    <button id="force-error">Force Error</button>
    <button id="network-failures" aria-pressed="false">Simulate Network Failures</button>
    <button id="remove-video">Remove Video</button>
    <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/mux-embed@latest/dist/mux.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <h1>Track HTML Video Test</h1>
    <script type="module">
      import * as amplitude from '@amplitude/analytics-browser';

      const networkButton = document.getElementById('network-failures');
      let simulateNetworkFailures = false;
      networkButton.addEventListener('click', () => {
        simulateNetworkFailures = !simulateNetworkFailures;
        networkButton.textContent = simulateNetworkFailures ? 'Restore Analytics Network' : 'Simulate Network Failures';
        networkButton.setAttribute('aria-pressed', String(simulateNetworkFailures));
      });

      // Reject only Amplitude ingestion requests, leaving video segments and Mux monitoring online.
      const originalFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = new URL(input instanceof Request ? input.url : input, window.location.href);
        const method = init?.method ?? (input instanceof Request ? input.method : 'GET');
        if (
          simulateNetworkFailures &&
          method.toUpperCase() === 'POST' &&
          /^\/2\/httpapi(?:\/delayed)?\/?$/.test(url.pathname)
        ) {
          console.warn('[Video analytics] Simulated network failure', url.href);
          throw new TypeError('Failed to fetch (simulated analytics network failure)');
        }
        return originalFetch(input, init);
      };

      // generate a View Session ID to be used for Mux and Amplitude
      // so that views can be linked together
      const muxViewSessionId = Date.now();

      // the User ID of the logged-in user (if available)
      // (do not use an ID with PII)
      const userId = 'random-user-id';
      
      const video = document.getElementById('video');

      // hls.js is preferred wherever MSE exists, which includes Chrome. Native
      // playback is only a fallback for iOS Safari. Do not gate this on
      // canPlayType(): Chrome returns a truthy "maybe" for HLS MIME types
      // despite being unable to play a manifest.
      const playlist = [
        {
          id: 'video-123',
          title: 'My Video',
          src: 'https://stream.mux.com/iBXEG00ifc9cPSv005eKgQ01g3w42LUGdlFWlmeosVuGfU.m3u8',
        },
        {
          id: 'video-456',
          title: 'Big Buck Bunny',
          src: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
        },
      ];
      let currentIndex = 0;

      let hls = null;
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(playlist[currentIndex].src);
        hls.attachMedia(video);
      } else {
        video.src = playlist[currentIndex].src;
      }

      // MUX VIDEO MONITORING
      // monitor the video for Mux analytics
      mux?.monitor(video, {
        // handing Mux the hls.js instance lets it report manifest and segment level metrics
        ...(hls ? { hlsjs: hls, Hls } : {}),
        data: {
          view_session_id: muxViewSessionId,
          viewer_user_id: userId,
        },
      });

      // AMPLITUDE VIDEO ANALYTICS

      // initialize Amplitude
      amplitude.setUserId(userId);
      amplitude.init(import.meta.env.VITE_AMPLITUDE_API_KEY, {
        fetchRemoteConfig: false,
        autocapture: false,
      }).promise.then(() => {
        mux.updateData(video, {
          custom_1: amplitude.getDeviceId(),
          custom_2: amplitude.getSessionId(),
        });
      });

      // capture analytics events for Video Start and Video Stop
      const stopVideoCapture = amplitude.trackVideo(amplitude, video, {
        vendor: 'mux',
        extraEventProperties: {
          mux_view_session_id: muxViewSessionId,
        },
      });

      const loadVideo = (index) => {
        currentIndex = index;
        const entry = playlist[currentIndex];

        video.setAttribute('metadata-video-id', entry.id);
        video.setAttribute('metadata-video-title', entry.title);

        // tell Mux a new video is starting on the same element so it starts a new view
        mux?.emit(video, 'videochange', {
          video_id: entry.id,
          video_title: entry.title,
        });

        if (hls) {
          hls.loadSource(entry.src);
        } else {
          video.src = entry.src;
        }
        video.play().catch(() => {});
      };

      document.getElementById('prev-video').addEventListener('click', () => {
        loadVideo((currentIndex - 1 + playlist.length) % playlist.length);
      });

      document.getElementById('next-video').addEventListener('click', () => {
        loadVideo((currentIndex + 1) % playlist.length);
      });

      document.getElementById('stop-video').addEventListener('click', () => {
        stopVideoCapture();
      });

      document.getElementById('force-error').addEventListener('click', () => {
        video.dispatchEvent(new Event('error'));
      });

      document.getElementById('remove-video').addEventListener('click', () => {
        video.remove();
      });
    </script>
  </body>
</html>
