name: Publishing script tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-publishing:
    name: Test publishing scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # Uploader regression tests exercise the real AWS SDK with a fake transport.
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24.x
      - run: node --test scripts/publish/*.test.js
