name: Publish custom enrichment

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Exact plugin version already committed on the selected main or hotfix branch
        required: true

concurrency:
  group: publish-custom-enrichment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Validate protected branch
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            main|hotfix/*) ;;
            *) echo 'Run from main or hotfix/* only.' >&2; exit 1 ;;
          esac
      - name: Check release permission
        uses: lannonbr/repo-permission-check-action@2bb8c89ba8bf115c4bfab344d6a6f442b24c9a1f
        with:
          permission: write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stage:
    name: Build and stage custom enrichment
    needs: authorize
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out selected commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
      - name: Validate intended stable version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const pkg = require('./packages/plugin-custom-enrichment-browser/package.json');
          if (pkg.version !== process.env.EXPECTED_VERSION || !/^\d+\.\d+\.\d+$/.test(pkg.version)) {
            throw new Error('Commit the intended stable plugin version before running this workflow.');
          }
          NODE
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          node-version: 24.x
          package-scope: '@amplitude/plugin-custom-enrichment-browser'
          configure-git: 'false'
          configure-aws: 'false'
      - name: Stage plugin through Trusted Publishing
        id: stage
        run: bash scripts/publish/stage-custom-enrichment.sh

      - name: Show publishing status and next steps
        env:
          PLUGIN_VERSION: ${{ steps.stage.outputs.version }}
          STAGE_REQUIRED: ${{ steps.stage.outputs.required }}
        run: |
          {
            echo '## Custom enrichment publishing'
            echo
            echo "Package: @amplitude/plugin-custom-enrichment-browser@$PLUGIN_VERSION"
            echo
            if [ "$STAGE_REQUIRED" = 'true' ]; then
              echo 'Staging succeeded. This version is awaiting npm approval and is not live yet.'
              echo
              echo 'Open [npmjs.com](https://www.npmjs.com/), sign in, and go to **Staged Packages**. Review this package version and click **Approve** to publish it.'
              echo
              echo 'No further confirmation in GitHub Actions is needed.'
              echo
              echo '[npm staged publishing instructions](https://docs.npmjs.com/staged-publishing/)'
            else
              echo 'This version is already live on npm. No approval is needed.'
            fi
            echo
            echo "[View package version on npm](https://www.npmjs.com/package/@amplitude/plugin-custom-enrichment-browser/v/$PLUGIN_VERSION)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
