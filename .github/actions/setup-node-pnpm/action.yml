name: 'Setup Node and pnpm'
description: 'Set up pnpm and Node.js with a pnpm cache, and install workspace dependencies'

# Callers still need their own actions/checkout step: a local action can only be
# resolved once the repository is on disk. For the same reason, a job that
# replaces the working tree mid-run cannot use this action — its post step would
# fail once this file is gone. See the check-size-limits job in ci-nx.yml.

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install project dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
