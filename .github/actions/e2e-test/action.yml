name: 'E2E Test'
description: 'Setup environment, build packages, start dev server, and run Playwright E2E tests'

inputs:
  amplitude-api-key:
    description: 'Amplitude API key for E2E tests'
    required: true
  amplitude-user-id:
    description: 'Amplitude user ID for E2E tests'
    required: false
    default: 'github-actions-sdk-user'
  server-port:
    description: 'Port for the dev server'
    required: false
    default: '5173'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20.x'

runs:
  using: 'composite'
  steps:
    - name: Setup Node and pnpm
      uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build all packages
      shell: bash
      run: pnpm build

    - name: Create .env file
      shell: bash
      env:
        VITE_AMPLITUDE_API_KEY: ${{ inputs.amplitude-api-key }}
        VITE_AMPLITUDE_USER_ID: ${{ inputs.amplitude-user-id }}
      run: |
        printf 'VITE_AMPLITUDE_API_KEY=%s\n' "$VITE_AMPLITUDE_API_KEY" > .env
        printf 'VITE_AMPLITUDE_USER_ID=%s\n' "$VITE_AMPLITUDE_USER_ID" >> .env

    - name: Start dev server
      shell: bash
      env:
        SERVER_PORT: ${{ inputs.server-port }}
      run: |
        if ! [[ "$SERVER_PORT" =~ ^[0-9]+$ ]]; then
          echo "Invalid server port: $SERVER_PORT"
          exit 1
        fi
        pnpm build:vite
        pnpm start --port "$SERVER_PORT" &
        sleep 10
        curl -f "http://localhost:$SERVER_PORT" || exit 1

    - name: Run Playwright tests
      shell: bash
      run: pnpm test:playwright:ci

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30
